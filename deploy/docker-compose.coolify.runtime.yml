services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: therapist_platform
      POSTGRES_USER: therapist_platform
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - therapist-platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapist_platform -d therapist_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: therapist-platform-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      API_PREFIX: /api
      DATABASE_URL: postgresql://therapist_platform:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/therapist_platform?schema=public
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_64_REFRESH}
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:18080
      BACKEND_URL: http://localhost:18080
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: local-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-service-role-key
      SUPABASE_STORAGE_BUCKET: therapist-platform-local
      STRIPE_SECRET_KEY: sk_test_local_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_local_placeholder
      AUDIT_IP_HASH_SALT: ""
      SAAS_BILLING_ENABLED: "false"
      SAAS_PROFESSIONAL_PRICE_ID: ""
      SAAS_PROFESSIONAL_MONTHLY_PRICE_CENTS: ""
      SAAS_STUDIO_PRICE_ID: ""
      SAAS_STUDIO_MONTHLY_PRICE_CENTS: ""
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: local
      SMTP_PASS: local
      EMAIL_FROM_NAME: Therapist Platform Local
      EMAIL_FROM_ADDRESS: noreply@therapist-platform.local
      CONTACT_EMAIL: contato@therapist-platform.local
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    image: therapist-platform-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  therapist-platform-db:
    name: therapist-platform-local-db
