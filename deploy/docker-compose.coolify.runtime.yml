services:
  backend:
    image: therapist-platform-backend:local
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      API_PREFIX: /api
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_64_REFRESH}
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:18080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:18080,http://localhost:18080}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:18080}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      SUPABASE_PRIVATE_STORAGE_BUCKET: ${SUPABASE_PRIVATE_STORAGE_BUCKET:-therapist-private}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-therapist-platform}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_local_placeholder}
      AUDIT_IP_HASH_SALT: ${AUDIT_IP_HASH_SALT:-}
      SAAS_BILLING_ENABLED: ${SAAS_BILLING_ENABLED:-false}
      SAAS_PROFESSIONAL_PRICE_ID: ${SAAS_PROFESSIONAL_PRICE_ID:-}
      SAAS_PROFESSIONAL_MONTHLY_PRICE_CENTS: ${SAAS_PROFESSIONAL_MONTHLY_PRICE_CENTS:-}
      SAAS_STUDIO_PRICE_ID: ${SAAS_STUDIO_PRICE_ID:-}
      SAAS_STUDIO_MONTHLY_PRICE_CENTS: ${SAAS_STUDIO_MONTHLY_PRICE_CENTS:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-local}
      SMTP_PASS: ${SMTP_PASS:-local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Therapist Platform Local}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@therapist-platform.local}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contato@therapist-platform.local}
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    image: therapist-platform-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
