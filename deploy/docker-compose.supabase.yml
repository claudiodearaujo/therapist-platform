# Apply only after the approved backup, restore drill and cutover in docs/SUPABASE-CUTOVER.md.
# This overlay retains the local PostgreSQL service and volume for rollback.
services:
  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Approved Supabase DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?Supabase direct or session-pooler migration URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:18080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:18080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:18080,http://localhost:18080}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      # New keys win; legacy keys remain valid for existing projects.
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:?SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY is required}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is required}}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-therapist-platform}
      SUPABASE_PRIVATE_STORAGE_BUCKET: ${SUPABASE_PRIVATE_STORAGE_BUCKET:-therapist-private}
      SUPABASE_STORAGE_INIT: "true"
