name: Security
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    name: Dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Audit lockfile including build dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high
  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql.yml
      - uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
          upload: false
      - name: Enforce high severity findings
        run: node scripts/security/sarif-gate.cjs sarif-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: sarif-results
  integration:
    name: Security integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: therapist_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/therapist_security_test
      JWT_SECRET: security-test-only-access-secret-32-characters
      JWT_REFRESH_SECRET: security-test-only-refresh-secret-32-characters
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: synthetic-test-key
      SUPABASE_SERVICE_ROLE_KEY: synthetic-test-key
      STRIPE_SECRET_KEY: sk_test_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Validate local and explicit Supabase compose configurations
        run: |
          docker compose -f docker-compose.coolify.yml config --quiet
          docker compose -f docker-compose.coolify.yml -f deploy/docker-compose.supabase.yml config --quiet
          docker compose -f deploy/docker-compose.coolify.runtime.yml -f deploy/docker-compose.supabase.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci
          SERVICE_PASSWORD_64_POSTGRES: ci
          SERVICE_PASSWORD_64_JWT: synthetic-test-jwt-secret
          SERVICE_PASSWORD_64_REFRESH: synthetic-test-refresh-secret
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/therapist_security_test
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Simulate Supabase Data API roles in disposable PostgreSQL
        run: node scripts/supabase-security.cjs prepare
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: node scripts/security-integration.cjs
        working-directory: backend
      - name: Verify Supabase Data API isolation
        run: node scripts/supabase-security.cjs verify
        working-directory: backend
      - name: Database integration tests (disposable CI database)
        run: npm run test:integration -- --ci --runInBand
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/therapist_security_test
      - run: node --test scripts/security/gates.test.cjs
