name: Temporary dependency lockfile repair
on:
  push:
    branches:
      - fix/dependency-security-audit-20261012
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update compatible vulnerable dependencies
        shell: bash
        run: |
          set -uo pipefail
          for dir in backend frontend; do
            echo "::group::Audit fix for $dir"
            (cd "$dir" && npm audit fix --package-lock-only --ignore-scripts) || true
            echo "::endgroup::"
          done
      - name: Commit compatible fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): apply nonbreaking npm security updates"
            git push origin HEAD:fix/dependency-security-audit-20261012
          fi
